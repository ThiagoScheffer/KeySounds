name: Build, test, and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore KeySounds.Tests/KeySounds.Tests.csproj
      - name: Build Release
        run: dotnet build KeySounds.Tests/KeySounds.Tests.csproj -c Release --no-restore
      - name: Run tests
        run: dotnet test KeySounds.Tests/KeySounds.Tests.csproj -c Release --no-build --no-restore --logger trx --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish Windows portable release
    needs: ci
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Publish and package
        shell: pwsh
        run: |
          ./scripts/publish-portable.ps1
          Compress-Archive -Path artifacts/publish/win-x64-portable/* -DestinationPath artifacts/KeySounds-win-x64-portable.zip
          $hash = (Get-FileHash artifacts/KeySounds-win-x64-portable.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  KeySounds-win-x64-portable.zip" | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" artifacts/KeySounds-win-x64-portable.zip artifacts/SHA256SUMS.txt --clobber
          } else {
            gh release create "$env:RELEASE_TAG" artifacts/KeySounds-win-x64-portable.zip artifacts/SHA256SUMS.txt --verify-tag --generate-notes --title "KeySounds $env:RELEASE_TAG"
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
